[build]
  publish = "."

# Clean URLs -> canonical .html
# 301 (not 200 rewrite) so search engines consolidate every article to a single
# canonical URL and we never expose a duplicate "extensionless" version.
# No Language condition: the redirect must fire for every visitor and crawler.
[[redirects]]
  from = "/articles/:slug"
  to = "/articles/:slug.html"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
